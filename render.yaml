services:
  - type: web
    name: pixelverse
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: pixelverse-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
